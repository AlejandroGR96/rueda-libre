<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Rueda Libre</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="tarifas.html">Tarifas y Rutas</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    <main>
        <h1>FORMULARIO DE RESERVAS</h1>

        <img class="logo" src="../img/logo.jpeg" alt="Logo Rueda Libre">

        <form action="#" method="post">
            <fieldset>
                <legend>Datos personales</legend>

                <label for="name">Nombre completo:</label>
                <input type="text" id="name" name="name" required>

                <label for="document">Documento:</label>
                <div>
                    <input type="checkbox" id="cc" name="tipo_documento" value="CC"> C.C
                    <input type="checkbox" id="ti" name="tipo_documento" value="TI"> T.I
                </div>
                <input type="text" id="document" name="document"
                       pattern="[0-9]{10}" required>

                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" required>

                <label for="tel">Teléfono:</label>
                <input type="tel" id="tel" name="tel" required>
            </fieldset>

            <fieldset>
                <legend>Alquiler</legend>

                <label for="date">Fecha de reserva:</label>
                <input type="date" name="date" id="date" required>

                <label for="bicicleta">Tipo de bicicleta:</label>
                <select name="bicicleta" id="bicicleta" required>
                    <option value="">Seleccione una opción</option>
                    <option value="urbana">Urbana</option>
                    <option value="montana">Montaña</option>
                    <option value="electrica">Eléctrica</option>
                </select>

                <label for="trayecto">Tipo de plan:</label>
                <select name="trayecto" id="trayecto" required>
                    <option value="">Seleccione una opción</option>
                    <option value="rios">Ríos y parques</option>
                    <option value="sabores">Sabores de barrio</option>
                    <option value="palmas">Reto Las Palmas</option>
                </select>

                <label for="cantB">Cantidad de bicicletas:</label>
                <input type="number" id="cantB" name="cantB" min="1" max="6" required>

                <label for="comentarios">Comentarios:</label>
                <textarea name="comentarios" id="comentarios" rows="4"></textarea>

                <div>
                    <input type="checkbox" id="politicas" name="politicas" required>
                    <label for="politicas">Acepto las políticas de alquiler.</label>
                </div>

                <br>
                <button type="submit">RESERVAR</button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>Rueda Libre - Alquiler de bicicletas</p>
        <p>alejogomezr1996@gmail.com</p>
        <p>2016</p>
    </footer>
</body>
</html>
