<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend><strong>DATOS</strong></legend>
                <p>
                    <label for="text">Nombre Completo: </label>
                    <input type="text" name="nombre" id="nombre" required>
                </p>
                <p>
                    <label for="text">Correo: </label>
                    <input type="email" id="email" name="email" required></input>
                </p>
                <p>
                    <label for="text">Celuar</label>
                    <input type="text" id="email" name="email" minlength="10">
                </p>
        </fieldset>

        <fieldset>
            <legend><strong>MOTIVO</strong></legend>
            <p>
                <label type="text">Motivo</label>
                <select name="select">
                    <option value="">Seleccione una opcion</option>
                    <option value="2">Reserva</option>
                    <option value="3">Pedido para empresa</option>
                </select>
            </p>

            <p>
                <label for="area">Razon: </label>
                <textarea name="area" id="area" rows="4" required></textarea>
            </p>

            <button id="enviar" name="enviar">ENVIAR</button>
        </fieldset>
    </form>
</body>
</html>
